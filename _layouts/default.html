<!doctype html>
<html lang="en">
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page Title -->
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }} | Case Western Reserve University</title>

    <!-- Search Engine Indexing & Verification -->
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="iu5YQ-TMjTNf77w9Pu2rACfi70SjSrQPijdXq1oAiM8" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="{{ site.description }}" />
    <meta
      name="keywords"
      content="TAPPAI, TAPPAI CWRU, Case Western Reserve University, CWRU AI, Computer and Data Sciences, AI Lab Cleveland, PEATAI"
    />
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}" />

    <!-- Open Graph (Link Previews & Search Snippets) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}" />
    <meta property="og:description" content="{{ site.description }}" />
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}" />
    <meta
      property="og:image"
      content="{{ '/assets/images/CWRU_Sunburst Icon_RGB Blue.png' | absolute_url }}"
    />

    <!-- Stylesheets & Favicon -->
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
    <link
      rel="icon"
      type="image/png"
      href="{{ '/assets/images/CWRU_Sunburst Icon_RGB Blue.png' | relative_url }}"
    />
  </head>
  <body>
    <header class="university-header">
      <div class="container">
        <a href="https://case.edu">
          <img
            src="{{ '/assets/images/logo-case.svg' | relative_url }}"
            alt="Case Western Reserve University"
          />
        </a>
      </div>
    </header>

    <header class="lab-header">
      <div class="container">
        <div class="lab-logo">
          <a href="{{ '/' | relative_url }}">
            <img
              src="{{ '/assets/images/TAPPAI.svg' | relative_url }}"
              alt="TAPPAI Lab Logo"
            />
          </a>
        </div>

        <input type="checkbox" id="nav-toggle" class="nav-toggle" />
        <label for="nav-toggle" class="nav-toggle-label">
          <span></span>
        </label>

        <nav>
          <ul>
            <li><a href="{{ '/' | relative_url }}">About</a></li>
            <li><a href="{{ '/faculty' | relative_url }}">Faculty</a></li>
            <li>
              <a href="{{ '/researchers' | relative_url }}">Researchers</a>
            </li>
            <li><a href="{{ '/research' | relative_url }}">Research</a></li>
            <li>
              <a href="{{ '/publications' | relative_url }}"
                >Publications & Code</a
              >
            </li>
            <li><a href="{{ '/news' | relative_url }}">News</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main-content">{{ content }}</main>

    <footer style="text-align: center; padding: 40px; color: #999">
      &copy; {{ site.time | date: '%Y' }} PEATAI Lab - Case Western Reserve
      University
    </footer>
    <script src="{{ '/assets/js/publication-navigation.js' | relative_url }}"></script> 
  </body>
</html>
