<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 50 900 460" role="img" aria-labelledby="pillars-title pillars-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="pillars-title">The four TAPPAI research pillars</title>
  <desc id="pillars-desc">Trustworthy, Agentic, Performant and Physical AI shown as four quadrants of one ellipse, meeting at a shared centre labelled Real-world AI, where all four are required.</desc>

  <style>
    svg      { font-family: "Arizona Sans", "Open Sans", Arial, Helvetica, sans-serif; }
    .name    { font-size: 35px; font-weight: 600; fill: #FFFFFF; }
    .promise { font-size: 19px; fill: #FFFFFF; fill-opacity: .84; }
    .core-a  { font-size: 26px; font-weight: 600; fill: #003071; }
    .core-b  { font-size: 14.5px; fill: #003071; fill-opacity: .78; }
  </style>

  <!-- panel: invisible on light pages, a clean white card on dark ones -->
  <rect x="150" y="50" width="900" height="460" rx="10" fill="#FFFFFF"/>

  <!-- quadrants, nudged outward along their bisectors so every seam points to the centre -->
  <g>
    <path d="M600,280 L600,70 A430,210 0 0 0 170,280 Z"   fill="#003071" transform="translate(-4,-4)"/>
    <path d="M600,280 L1030,280 A430,210 0 0 0 600,70 Z"  fill="#2359EF" transform="translate(4,-4)"/>
    <path d="M600,280 L170,280 A430,210 0 0 0 600,490 Z"  fill="#09143A" transform="translate(-4,4)"/>
    <path d="M600,280 L600,490 A430,210 0 0 0 1030,280 Z" fill="#007AB8" transform="translate(4,4)"/>
  </g>

  <g text-anchor="middle">
    <text class="name"    x="430" y="142">Trustworthy</text>
    <text class="promise" x="430" y="171">Systems that know their limits</text>

    <text class="name"    x="775" y="142">Agentic</text>
    <text class="promise" x="775" y="171">Systems that act</text>

    <text class="name"    x="430" y="392">Performant</text>
    <text class="promise" x="430" y="419">Systems that scale</text>

    <text class="name"    x="775" y="392">Physical</text>
    <text class="promise" x="775" y="419">Systems that meet the world</text>
  </g>

  <!-- the shared centre -->
  <circle cx="600" cy="280" r="112" fill="#FFFFFF" stroke="#003071" stroke-width="2"/>
  <g text-anchor="middle">
    <text class="core-a" x="600" y="277">Real-world AI</text>
    <text class="core-b" x="600" y="304">where all four are required</text>
  </g>
</svg>
