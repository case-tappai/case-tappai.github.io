<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="cont-title cont-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="cont-title">The compute continuum, from sensor to quantum processor</title>
  <desc id="cont-desc">One band running from sensors and edge devices through lab clusters, cloud and national supercomputers to quantum processors. Workloads and data move toward compute; trained models and capability move back out. Research at each point is listed beneath.</desc>

  <style>
    svg      { color: #09143A; font-family: "Arizona Sans", "Open Sans", Arial, Helvetica, sans-serif; }
    .station { font-size: 18px; font-weight: 600; fill: #09143A; }
    .sub     { font-size: 13px; fill: #09143A; fill-opacity: .62; }
    .flow    { font-size: 13.5px; fill: #09143A; fill-opacity: .78; }
    .work    { font-size: 13px; fill: #09143A; fill-opacity: .70; }
  </style>

  <defs>
    <linearGradient id="continuum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#A6D2E6"/>
      <stop offset="0.27" stop-color="#007AB8"/>
      <stop offset="0.55" stop-color="#003071"/>
      <stop offset="1"    stop-color="#09143A"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5,1 L8.5,5 L0.5,9" fill="none" stroke="#09143A" stroke-opacity=".45" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1400" height="420" rx="10" fill="#FFFFFF"/>

  <rect x="90" y="150" width="1220" height="24" rx="12" fill="url(#continuum)"/>

  <g text-anchor="middle">
    <text class="station" x="188" y="112">Sensor and edge</text>
    <text class="sub"     x="188" y="133">robots, vehicles, instruments</text>
    <circle cx="188" cy="162" r="10" fill="#FFFFFF" stroke="#7CBEDC" stroke-width="3"/>

    <text class="station" x="444" y="112">Lab cluster</text>
    <text class="sub"     x="444" y="133">GPUs and accelerators</text>
    <circle cx="444" cy="162" r="10" fill="#FFFFFF" stroke="#007AB8" stroke-width="3"/>

    <text class="station" x="700" y="112">Cloud</text>
    <text class="sub"     x="700" y="133">elastic, shared services</text>
    <circle cx="700" cy="162" r="10" fill="#FFFFFF" stroke="#003D7E" stroke-width="3"/>

    <text class="station" x="956" y="112">Supercomputer</text>
    <text class="sub"     x="956" y="133">national HPC facilities</text>
    <circle cx="956" cy="162" r="10" fill="#FFFFFF" stroke="#03265E" stroke-width="3"/>

    <text class="station" x="1212" y="112">Quantum processor</text>
    <text class="sub"     x="1212" y="133">an emerging accelerator</text>
    <circle cx="1212" cy="162" r="10" fill="#FFFFFF" stroke="#071943" stroke-width="3"/>
  </g>

  <g text-anchor="middle">
    <text class="flow" x="700" y="222">workloads, measurements and data move toward compute</text>
    <path d="M110,238 H1290" fill="none" stroke="#09143A" stroke-opacity=".45" stroke-width="1.6" marker-end="url(#tip)"/>

    <text class="flow" x="700" y="278">trained models and capability move back out</text>
    <path d="M1290,294 H110" fill="none" stroke="#09143A" stroke-opacity=".45" stroke-width="1.6" marker-end="url(#tip)"/>
  </g>

  <g text-anchor="middle" class="work">
    <text x="188" y="344">focused convolutions,<tspan x="188" dy="17">low-latency perception,</tspan><tspan x="188" dy="17">on-device inference</tspan></text>
    <text x="444" y="344">sparse attention scheduling,<tspan x="444" dy="17">kernel and tile optimization</tspan></text>
    <text x="700" y="344">AI-as-a-Service,<tspan x="700" dy="17">plug-and-play</tspan><tspan x="700" dy="17">cyberinfrastructure</tspan></text>
    <text x="956" y="344">distributed training<tspan x="956" dy="17">performance models,</tspan><tspan x="956" dy="17">log anomaly detection</tspan></text>
    <text x="1212" y="344">circuit cutting, parallel job<tspan x="1212" dy="17">scheduling, hardware-aware</tspan><tspan x="1212" dy="17">synthesis</tspan></text>
  </g>
</svg>
