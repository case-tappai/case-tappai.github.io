<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="mx-title mx-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mx-title">Research pillars by application domain</title>
  <desc id="mx-desc">A grid showing which of the four pillars are active in each application domain. A solid square marks an established programme, an outlined square with a dot marks work that is active and growing, and a dashed outline marks an area that is not a current focus. Health and medicine: Trustworthy established, Agentic growing, Performant growing, Physical established. Materials, manufacturing and energy: Trustworthy growing, Agentic not a current focus, Performant established, Physical established. Science cyberinfrastructure: Trustworthy established, Agentic growing, Performant established, Physical growing. Mobility and autonomy: Trustworthy growing, Agentic not a current focus, Performant established, Physical established. Language and knowledge systems: Trustworthy established, Agentic established, Performant established, Physical not a current focus. Software and systems engineering: Trustworthy established, Agentic established, Performant growing, Physical not a current focus.</desc>

  <style>
    svg     { font-family: "Arizona Sans", "Open Sans", Arial, Helvetica, sans-serif; }
    .head   { font-size: 15px; font-weight: 600; }
    .row    { font-size: 15px; fill: #09143A; }
    .legend { font-size: 13px; fill: #09143A; fill-opacity: .72; }
  </style>

