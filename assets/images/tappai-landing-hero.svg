<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" role="img" aria-labelledby="hero-title hero-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="hero-title">Four research commitments converging into one deployable system</title>
  <desc id="hero-desc">Four colored strands — Trustworthy, which knows its limits; Agentic, which acts on its own; Performant, which runs at scale; and Physical, which meets the world — sweep rightward, converge, and continue off the edge of the frame as a single banded cable carrying all four, at work in medicine, materials, mobility and infrastructure.</desc>

  <style>
    svg      { font-family: "Arizona Sans", "Open Sans", Arial, Helvetica, sans-serif; }
    .pillar  { font-size: 36px; font-weight: 600; }
    .sub     { font-size: 15px; fill: #09143A; fill-opacity: .60; }
    @media (max-width: 760px) {
      .sub    { display: none; }
      .pillar { font-size: 44px; }
    }
  </style>

  <rect width="1440" height="440" rx="10" fill="#FFFFFF"/>

  <!-- four strands: spread at the left, touching at the right, bleeding off the frame -->
  <g fill="none" stroke-width="26" stroke-linecap="round">
    <path d="M360,80 C580,80 780,191 1000,191 L1440,191" stroke="#003071"/>
    <path d="M360,180 C580,180 780,217 1000,217 L1440,217" stroke="#2359EF"/>
    <path d="M360,280 C580,280 780,243 1000,243 L1440,243" stroke="#09143A"/>
    <path d="M360,380 C580,380 780,269 1000,269 L1440,269" stroke="#007AB8"/>
  </g>

  <!-- each strand leaves from its commitment -->
  <g text-anchor="end">
    <text class="pillar" x="330" y="77" fill="#003071">Trustworthy</text>
    <text class="sub"    x="330" y="100">knows its limits</text>

    <text class="pillar" x="330" y="177" fill="#2359EF">Agentic</text>
    <text class="sub"    x="330" y="200">acts on its own</text>

    <text class="pillar" x="330" y="277" fill="#09143A">Performant</text>
    <text class="sub"    x="330" y="300">runs at scale</text>

    <text class="pillar" x="330" y="377" fill="#007AB8">Physical</text>
    <text class="sub"    x="330" y="400">meets the world</text>
  </g>

  <text class="sub" x="1000" y="320">at work in medicine, materials, mobility and infrastructure</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
